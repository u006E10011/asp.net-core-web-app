services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devlog-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DevLogConnection: Host=postgres;Port=5432;Database=devlog;Username=devlog;Password=devlogpass
      AdminAuth__Username: admin
      AdminAuth__Password: devlog-admin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: devlog-postgres
    environment:
      POSTGRES_DB: devlog
      POSTGRES_USER: devlog
      POSTGRES_PASSWORD: devlogpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlog -d devlog"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: devlog-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter
      - blackbox-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: devlog-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://devlog:devlogpass@postgres:5432/devlog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: devlog-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: devlog-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - prometheus

volumes:
  postgres-data:
