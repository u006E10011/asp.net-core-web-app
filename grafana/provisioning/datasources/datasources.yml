apiVersion: 1

datasources:
  - name: DevLog PostgreSQL
    uid: PDS_DEVLOG_POSTGRESQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: devlog
    secureJsonData:
      password: devlogpass
    jsonData:
      database: devlog
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: false

  - name: DevLog Prometheus
    uid: PDS_DEVLOG_PROMETHEUS
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
